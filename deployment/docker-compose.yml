services:
  backend:
    build:
      context: ..
      dockerfile: deployment/backend.Dockerfile
    environment: &backend_environment
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      CORS_SUPPORTS_CREDENTIALS: ${CORS_SUPPORTS_CREDENTIALS:-true}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      REMEMBER_COOKIE_SECURE: ${REMEMBER_COOKIE_SECURE:-true}
      PREFERRED_URL_SCHEME: ${PREFERRED_URL_SCHEME:-https}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Run only after manually approving the target database and its backup.
  migrate:
    profiles: ["migrate"]
    build:
      context: ..
      dockerfile: deployment/backend.Dockerfile
    command: python -m flask --app wsgi:app db upgrade
    environment: *backend_environment
    restart: "no"

  frontend:
    build:
      context: ..
      dockerfile: deployment/frontend.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
