services:
  - type: web
    name: fakeguard-api
    runtime: docker
    plan: free
    dockerfilePath: ./deployment/backend.Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CORS_SUPPORTS_CREDENTIALS
        value: "true"
      - key: LOG_LEVEL
        value: INFO

  - type: web
    name: fakeguard-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
